<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF Organizer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{--bg:#f2f3f7;--surface:#fff;--ink:#14213d;--muted:#5b6482;--line:#d9dce6;--accent:#ffc933;--accent-ink:#14213d;--danger:#c8372d;--ring:#3b6cf6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--surface:#18223a;--ink:#eef0f6;--muted:#9aa4c4;--line:#2b3756;--danger:#ff7b70;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1626;--surface:#18223a;--ink:#eef0f6;--muted:#9aa4c4;--line:#2b3756;--danger:#ff7b70;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:28px 20px 8px;max-width:1200px;margin:0 auto}
h1{margin:0;font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
header p{margin:6px 0 0;color:var(--muted);max-width:60ch}
main{max-width:1200px;margin:0 auto;padding:12px 20px 120px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,.drop:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;background:var(--bg)}
.bar .sp{flex:1}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);padding:10px 20px;font-weight:800}
.btn:disabled{opacity:.5;cursor:default}
.stat{color:var(--muted);font-size:14px}
.drop,.drop *{cursor:pointer}
.drop{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:20px;padding:64px 20px;border:2.5px dashed var(--ink);border-radius:18px;background:var(--surface);text-align:center}
.drop.hot,body.hot .drop{background:var(--accent);color:var(--accent-ink)}
.drop h2{margin:0;font-size:24px}
.drop p{margin:0;color:var(--muted)}
.drop.hot p,body.hot .drop p{color:inherit}
ul.grid{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;cursor:grab;transition:transform .12s}
.card.dragging{opacity:.35}
.card.over{outline:3px solid var(--ring);transform:translateY(-3px)}
.thumb{position:relative;height:200px;background:var(--bg);border-radius:6px;overflow:hidden}
.thumb img{position:absolute;left:50%;top:50%;max-width:100%;max-height:200px;box-shadow:0 1px 4px rgba(0,0,0,.25);background:#fff;pointer-events:none}
.thumb img.r{max-width:200px;max-height:150px}
.blank{position:absolute;inset:14px 20px;background:#fff;color:#8a90a6;display:grid;place-items:center;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.meta{display:flex;gap:8px;align-items:baseline;min-width:0}
.n{font-weight:800}
.fn{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;justify-content:space-between;gap:4px}
.acts button{flex:1;border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 0;font-size:16px;line-height:1.3}
.acts button:hover{border-color:var(--ink)}
.acts button[data-a=del]:hover{color:var(--danger);border-color:var(--danger)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;max-width:90vw;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>PDF Organizer</h1>
  <p>Add several PDFs, arrange the pages, and save one new file. Everything happens in your browser, so your files are never uploaded.</p>
</header>
<main>
  <div class="bar" id="bar" hidden>
    <button class="btn" id="add">Add PDFs</button>
    <button class="btn" id="blank">Add blank page</button>
    <button class="btn" id="rotall">Rotate all</button>
    <button class="btn" id="rev">Reverse order</button>
    <button class="btn danger" id="clear">Clear all</button>
    <span class="sp"></span>
    <span class="stat" id="stat" aria-live="polite"></span>
    <button class="btn primary" id="save">Save PDF</button>
  </div>
  <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose PDF files">
    <h2>Drop PDF files here</h2>
    <p>Or choose them from your device. You can add more files later to merge them.</p>
    <span class="btn primary">Choose PDFs</span>
  </div>
  <ul class="grid" id="grid" aria-label="Pages"></ul>
</main>
<input type="file" id="pick" accept="application/pdf,.pdf" multiple hidden>
<div id="toast" role="status"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $ = s => document.querySelector(s);
const COLORS = ['#3b6cf6','#e0612f','#1f9d6b','#a24bd6','#c79a00','#d6336c'];
const files = []; let pages = []; let uid = 0, dragId = null, busy = false;
const grid = $('#grid');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let tt; function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3500);}

async function addFiles(list){
  if (busy) return toast('Still reading files. Try again in a moment.');
  busy = true; $('#save').disabled = true;
  for (const f of list){
    if (!/\.pdf$/i.test(f.name) && f.type !== 'application/pdf'){ toast(f.name + ' isn’t a PDF, so it was skipped.'); continue; }
    toast('Reading ' + f.name + '…');
    try{
      const bytes = new Uint8Array(await f.arrayBuffer());
      const doc = await pdfjsLib.getDocument({data: bytes.slice()}).promise;
      const fi = files.length;
      files.push({name: f.name, bytes, color: COLORS[fi % COLORS.length]});
      for (let i = 1; i <= doc.numPages; i++){
        const p = await doc.getPage(i);
        const vp = p.getViewport({scale:1});
        const v = p.getViewport({scale: 300 / Math.max(vp.width, vp.height)});
        const c = document.createElement('canvas'); c.width = v.width; c.height = v.height;
        await p.render({canvasContext: c.getContext('2d'), viewport: v}).promise;
        pages.push({id:++uid, file:fi, index:i-1, rot:0, w:vp.width, h:vp.height, thumb:c.toDataURL('image/jpeg',.7)});
        if (i % 6 === 0) render();
      }
      doc.destroy();
    }catch(e){
      toast(e && e.name === 'PasswordException' ? f.name + ' is password-protected. Remove the password and add it again.' : 'Couldn’t read ' + f.name + '. The file may be damaged.');
    }
  }
  busy = false; $('#save').disabled = false; render();
}

function render(){
  const has = pages.length > 0;
  $('#bar').hidden = !has; $('#drop').hidden = has;
  $('#stat').textContent = pages.length + (pages.length === 1 ? ' page' : ' pages') + ' from ' + files.filter((_,i)=>pages.some(p=>p.file===i)).length + ' file(s)';
  grid.innerHTML = pages.map((p,i) => {
    const f = p.blank ? null : files[p.file];
    const img = p.blank ? '<div class="blank">Blank page</div>'
      : `<img src="${p.thumb}" alt="Page ${p.index+1} of ${esc(f.name)}" class="${p.rot%180?'r':''}" style="transform:translate(-50%,-50%) rotate(${p.rot}deg)">`;
    return `<li class="card" draggable="true" data-id="${p.id}" style="--c:${f?f.color:'var(--line)'}">
      <div class="thumb">${img}</div>
      <div class="meta"><span class="n">${i+1}</span><span class="fn">${f?esc(f.name)+' · p.'+(p.index+1):'Blank'}</span></div>
      <div class="acts">
        <button data-a="left" aria-label="Move earlier" title="Move earlier">←</button>
        ${p.blank?'':'<button data-a="rot" aria-label="Rotate 90°" title="Rotate 90°">↻</button>'}
        <button data-a="dup" aria-label="Duplicate page" title="Duplicate">⧉</button>
        <button data-a="del" aria-label="Remove page" title="Remove">✕</button>
        <button data-a="right" aria-label="Move later" title="Move later">→</button>
      </div></li>`;
  }).join('');
}

grid.addEventListener('click', e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const id = +b.closest('.card').dataset.id, i = pages.findIndex(p => p.id === id), a = b.dataset.a;
  if (a === 'del') pages.splice(i,1);
  else if (a === 'rot') pages[i].rot = (pages[i].rot + 90) % 360;
  else if (a === 'dup') pages.splice(i+1,0,{...pages[i], id:++uid});
  else if (a === 'left' && i > 0) [pages[i-1],pages[i]] = [pages[i],pages[i-1]];
  else if (a === 'right' && i < pages.length-1) [pages[i+1],pages[i]] = [pages[i],pages[i+1]];
  render();
});

// drag to reorder
grid.addEventListener('dragstart', e => { const c = e.target.closest('.card'); if (!c) return; dragId = +c.dataset.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain','page'); });
grid.addEventListener('dragover', e => { if (dragId === null) return; e.preventDefault(); const c = e.target.closest('.card'); grid.querySelectorAll('.over').forEach(x=>x.classList.remove('over')); if (c) c.classList.add('over'); });
grid.addEventListener('drop', e => {
  if (dragId === null) return; e.preventDefault();
  const c = e.target.closest('.card'); if (!c) return;
  const from = pages.findIndex(p => p.id === dragId), to = pages.findIndex(p => p.id === +c.dataset.id);
  if (from !== to){ const [m] = pages.splice(from,1); pages.splice(to,0,m); }
  dragId = null; render();
});
grid.addEventListener('dragend', () => { dragId = null; render(); });

// drop files anywhere
addEventListener('dragover', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')){ e.preventDefault(); document.body.classList.add('hot'); } });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('hot'); });
addEventListener('drop', e => { document.body.classList.remove('hot'); if (e.dataTransfer && e.dataTransfer.files.length){ e.preventDefault(); addFiles([...e.dataTransfer.files]); } });

const pick = $('#pick');
$('#drop').onclick = () => pick.click();
$('#drop').onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); pick.click(); } };
$('#add').onclick = () => pick.click();
pick.onchange = () => { addFiles([...pick.files]); pick.value = ''; };
$('#blank').onclick = () => { const last = [...pages].reverse().find(p=>p.w); pages.push({id:++uid, blank:true, rot:0, w:last?last.w:595, h:last?last.h:842}); render(); };
$('#rotall').onclick = () => { pages.forEach(p => { if (!p.blank) p.rot = (p.rot+90)%360; }); render(); };
$('#rev').onclick = () => { pages.reverse(); render(); };
$('#clear').onclick = () => { if (confirm('Remove all pages and files?')){ pages = []; files.length = 0; render(); } };

$('#save').onclick = async () => {
  if (!pages.length || busy) return;
  busy = true; $('#save').disabled = true; toast('Building your PDF…');
  try{
    const {PDFDocument, degrees} = PDFLib;
    const out = await PDFDocument.create(), cache = {};
    for (const p of pages){
      if (p.blank){ out.addPage([p.w, p.h]); continue; }
      const src = cache[p.file] || (cache[p.file] = await PDFDocument.load(files[p.file].bytes, {ignoreEncryption:true}));
      const [cp] = await out.copyPages(src, [p.index]);
      cp.setRotation(degrees((cp.getRotation().angle + p.rot) % 360));
      out.addPage(cp);
    }
    const bytes = await out.save();
    const used = [...new Set(pages.filter(p=>!p.blank).map(p=>p.file))];
    const name = used.length === 1 ? files[used[0]].name.replace(/\.pdf$/i,'') + '-organized.pdf' : 'organized.pdf';
    const blob = new Blob([bytes], {type:'application/pdf'});
    let dl = null;
    try{ dl = window.claude && claude.use ? await claude.use('downloads') : null; }catch(_){}
    if (dl){
      try{ await dl.save({filename:name, data:blob}); toast('Saved ' + name); }
      catch(err){ if (!err || err.code !== 'declined') toast('Couldn’t save the file. Try again.'); }
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('Saved ' + name);
    }
  }catch(e){ toast('Couldn’t build the PDF. One of the files may be damaged or protected.'); }
  busy = false; $('#save').disabled = false;
};
render();
</script>
</body>
</html>
